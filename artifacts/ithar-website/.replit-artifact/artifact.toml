kind = "web"
previewPath = "/"
title = "جمعية الإيثار - الموقع الرسمي"
version = "1.0.0"
id = "artifacts/ithar-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24396

[services.development]
run = "pnpm --filter @workspace/ithar-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ithar-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/ithar-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24396"
BASE_PATH = "/"
